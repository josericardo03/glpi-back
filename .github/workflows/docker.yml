name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Nome da imagem
        id: nome
        run: echo "imagem=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no registro do GitHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.nome.outputs.imagem }}:latest
            ${{ steps.nome.outputs.imagem }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  atualizar:
    needs: imagem
    if: github.event_name == 'push' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar front, API, banco e Nginx
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_ADMIN_EMAIL: ${{ vars.SEED_ADMIN_EMAIL }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_TOKEN,POSTGRES_PASSWORD,JWT_SECRET,SEED_ADMIN_PASSWORD,SEED_ADMIN_EMAIL,JWT_EXPIRES_IN
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH || '/opt/glpi-front' }}"
            umask 077
            cat > .env << EOF
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
            SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@itsm.local}
            SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD
            EOF
            TOKEN="$GHCR_TOKEN"
            if [ -z "$TOKEN" ]; then TOKEN="$GITHUB_TOKEN"; fi
            echo "$TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
